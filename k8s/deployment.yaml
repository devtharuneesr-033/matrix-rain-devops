apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-rain-deployment
  namespace: default
  labels:
    app.kubernetes.io/name: matrix-rain-effect
    app.kubernetes.io/tier: frontend
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-rain-effect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-rain-effect
        app.kubernetes.io/tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx default non-root user ID
        fsGroup: 101
      containers:
        - name: matrix-rain-app
          image: devopsuser/matrix-rain-effect:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: matrix-rain-config
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
